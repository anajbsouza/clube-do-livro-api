spring.application.name=clube-do-livro-api

# Banco: os valores vem de variaveis de ambiente; depois do ":" fica o padrao para rodar local
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/clube_do_livro}
spring.datasource.username=${DB_USER:clube}
spring.datasource.password=${DB_PASSWORD:clube}

# Quem cria e altera as tabelas e o Flyway. O Hibernate so confere se as entities batem com o banco.
spring.jpa.hibernate.ddl-auto=validate
# Fecha a conexao com o banco ao sair do service, e nao so no fim da requisicao HTTP
spring.jpa.open-in-view=false

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
